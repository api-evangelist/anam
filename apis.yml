aid: anam
name: Anam
description: >-
  Anam builds real-time, interactive AI avatars — photorealistic conversational personas that
  hold face-to-face video conversations for customer support, sales, tutoring, medical and
  training use cases. Its CARA avatar engine streams over WebRTC with sub-200ms latency and
  70+ languages, fronted by a REST API (api.anam.ai) for managing personas, avatars, voices,
  LLM routing, knowledge (RAG) groups, function-calling tools, session tokens, share links and
  session analytics. Developers integrate via first-party JavaScript and Python SDKs, a Kotlin
  Multiplatform SDK, and a Pipecat plugin, or embed a no-code widget. Anam is a Redpoint
  Ventures portfolio company.
